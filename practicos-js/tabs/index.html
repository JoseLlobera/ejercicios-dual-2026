<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/src/index.js"></script>
  <title>Tabs</title>
</head>

<body>
  <div class="container-general">
    <div class="tabs">
      <button class="tab active" data-tab="tokyo">General</button>
      <button class="tab" data-tab="la">Images</button>
    </div>

    <div class="tab-contents">
      <form>
        <div class="tab-content active" data-tab="tokyo">
          <div class="form-element">
            <label for="">Nombre</label>
            <input type="text">
          </div>
        </div>
        <div class="tab-content" data-tab="la">
          <label for="">Edad</label>
          <input type="text">
        </div>
      </form>
    </div>
  </div>
</body>

</html>
